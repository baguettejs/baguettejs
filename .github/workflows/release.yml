name: Release packages

on:
  push:
    # Accept both `1.0.0` and `v1.0.0` release tags.
    tags: ['v*', '[0-9]*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '${RELEASE_TAG}'. Expected X.Y.Z or vX.Y.Z."
            exit 1
          fi

          for package in packages/*; do
            VERSION=$(bun -e "console.log((await Bun.file(process.argv[1]).json()).version)" "$package/package.json")
            if [[ "${VERSION}" != "${RELEASE_VERSION}" ]]; then
              echo "${package} is version ${VERSION}, expected ${RELEASE_VERSION}."
              exit 1
            fi
          done
      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: bun x changeset publish
